# 数字人手势行为配置
# Digital Human Gesture Behavior Configuration

# 头部微动配置
head_micro_movements:
  enabled: true                    # 是否启用头部微动
  probability: 0.85                # 头部微动出现概率 (0-1)，提高到0.75增加头部动作频率
  # 头部微动让机器人说话时更自然，像真人一样有小幅度的头部动作

# 双手动作配置
both_hands_gestures:
  prefer_both_hands: true          # 是否优先使用双手动作
  probability: 0.4                 # 双手动作出现概率 (0-1)
  # 双手动作让表达更丰富，但不要太频繁

# 说话时手臂幅度限制（更像人、无大开感）
# 关节1=肩前后，关节2=肩外展
speech_arm_limits:
  joint1_max: 30.0     # 一号关节(肩前后)最大约30度
  joint2_min: 10.0     # 二号关节(肩外展)最小10度
  joint2_max: 15.0     # 二号关节(肩外展)最大15度

# 手势多样性配置
gesture_diversity:
  avoid_repetition: true           # 避免连续重复相同手势
  mix_single_and_both: true        # 混合单手和双手动作
  # 让手势更自然多样

# 说明：
# - probability 值越大，对应类型的手势出现越频繁
# - 建议头部微动概率 0.5-0.7，双手动作概率 0.3-0.5
# - 如果觉得动作太多，可以降低概率值
# - 如果觉得动作太单调，可以提高概率值
