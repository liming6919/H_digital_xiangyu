# 手势速度配置文件
# 用于控制不同类型手势的速度

# 头部动作速度因子（0-1之间）
# 1.0 = 正常速度
# 0.5 = 减慢到50%速度（时长加倍）
# 0.3 = 减慢到30%速度（时长变为3.3倍）
head_speed_factor: 0.8

# 说明：
# - 值越小，动作越慢
# - 建议范围：0.3 - 1.0
# - 0.5 是一个比较自然的慢速度
# - 修改后重启程序即可生效

# 示例：
# head_speed_factor: 1.0   # 正常速度
# head_speed_factor: 0.7   # 稍慢
# head_speed_factor: 0.5   # 慢速（推荐）
# head_speed_factor: 0.3   # 很慢
