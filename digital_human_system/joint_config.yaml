# 关节配置文件
# 用于统一控制各个关节的方向、范围等参数

# 关节方向配置
# direction: 1 表示正向，-1 表示反向
# 如果某个关节的运动方向与预期相反，只需将direction改为-1

joint_directions:
  # 头部关节
  head_yaw: 1          # 头部左右转动
  head_pitch: 1        # 头部上下点头
  
  # 左臂关节
  left_shoulder_pitch: 1   # 左肩前后摆动
  left_shoulder_roll: 1    # 左肩左右展开
  left_shoulder_yaw: 1     # 左肩旋转
  left_elbow: -1            # 左肘弯曲
  left_wrist: 1            # 左腕旋转
  
  # 右臂关节
  right_shoulder_pitch: 1  # 右肩前后摆动
  right_shoulder_roll: 1   # 右肩左右展开
  right_shoulder_yaw: 1    # 右肩旋转
  right_elbow: -1           # 右肘弯曲
  right_wrist: 1           # 右腕旋转

# 关节角度范围限制（度）
# 用于安全保护，防止关节超出物理限制
joint_limits:
  head_yaw: [-90, 90]
  head_pitch: [-45, 45]
  
  left_shoulder_pitch: [-180, 180]
  left_shoulder_roll: [-90, 90]
  left_shoulder_yaw: [-180, 180]
  left_elbow: [0, 150]
  left_wrist: [-90, 90]
  
  right_shoulder_pitch: [-180, 180]
  right_shoulder_roll: [-90, 90]
  right_shoulder_yaw: [-180, 180]
  right_elbow: [0, 150]
  right_wrist: [-90, 90]

# 关节零位偏移（度）
# 如果某个关节的零位不在标准位置，可以添加偏移
joint_offsets:
  head_yaw: 0
  head_pitch: 0
  
  left_shoulder_pitch: 0
  left_shoulder_roll: 0
  left_shoulder_yaw: 0
  left_elbow: 0
  left_wrist: 0
  
  right_shoulder_pitch: 0
  right_shoulder_roll: 0
  right_shoulder_yaw: 0
  right_elbow: 0
  right_wrist: 0

# 关节名称映射（如果你的系统使用不同的关节名称）
joint_name_mapping:
  head_yaw: "head_yaw"
  head_pitch: "head_pitch"
  left_shoulder_pitch: "left_shoulder_pitch"
  left_shoulder_roll: "left_shoulder_roll"
  left_shoulder_yaw: "left_shoulder_yaw"
  left_elbow: "left_elbow"
  left_wrist: "left_wrist"
  right_shoulder_pitch: "right_shoulder_pitch"
  right_shoulder_roll: "right_shoulder_roll"
  right_shoulder_yaw: "right_shoulder_yaw"
  right_elbow: "right_elbow"
  right_wrist: "right_wrist"

# 使用说明：
# 1. 如果某个关节运动方向相反，将对应的direction改为-1
# 2. 如果需要调整关节范围，修改joint_limits
# 3. 如果零位有偏移，修改joint_offsets
# 4. 修改后无需重启系统，重新加载配置即可生效
